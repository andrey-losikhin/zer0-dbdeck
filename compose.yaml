services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: dbdeck_test
      POSTGRES_USER: dbdeck_test
      POSTGRES_PASSWORD: ${DBDECK_PG_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tests/fixtures/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbdeck_test -d dbdeck_test"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mariadb:
    image: mariadb:11.4.13
    environment:
      MARIADB_DATABASE: dbdeck_test
      MARIADB_USER: dbdeck_test
      MARIADB_PASSWORD: ${DBDECK_MARIADB_PASSWORD:?Copy .env.example to .env first}
      MARIADB_ROOT_PASSWORD: ${DBDECK_MARIADB_ROOT_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:53306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./tests/fixtures/mariadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dbdeck_test
      MYSQL_USER: dbdeck_test
      MYSQL_PASSWORD: ${DBDECK_MYSQL_PASSWORD:?Copy .env.example to .env first}
      MYSQL_ROOT_PASSWORD: ${DBDECK_MYSQL_ROOT_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:53307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./tests/fixtures/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  postgres_data:
  mariadb_data:
  mysql_data:
